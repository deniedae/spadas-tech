name: Autonoma AI End-to-End UI Testing

on:
  pull_request:
    branches: [main]
  deployment_status:

jobs:
  autonoma-test:
    name: Autonoma AI Test Agent Exploration
    if: github.event_name == 'pull_request' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set target URL
        id: target-url
        run: |
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            echo "target_url=${{ github.event.deployment_status.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "target_url=https://spadas-tech.vercel.app" >> $GITHUB_OUTPUT
          fi

      - name: Execute Autonoma AI UI Testing Agent
        uses: autonoma-ai/action@v1
        continue-on-error: true
        with:
          api-key: ${{ secrets.AUTONOMA_API_KEY }}
          config: autonoma.config.json
          app-url: ${{ steps.target-url.outputs.target_url }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
