<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Offline Dead-Zone Mode · Spadas AI</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.25rem;
      touch-action: manipulation;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 2.25rem 1.75rem;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 0 20px rgba(245,158,11,0.4));
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      margin: 0 0 0.5rem 0;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 1.5rem 0;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    button, a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      height: 3rem;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: white;
      text-decoration: none;
      border: none;
      font-weight: 800;
      border-radius: 0.85rem;
      cursor: pointer;
      font-size: 0.875rem;
      box-shadow: 0 4px 14px rgba(6,182,212,0.3);
      transition: transform 0.1s;
    }
    button:active, a.btn:active {
      transform: scale(0.97);
    }
    a.btn-secondary {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(51, 65, 85, 0.8);
      color: #e2e8f0;
      box-shadow: none;
    }
    .signal-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 55px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <div class="signal-dot"></div>
      THRIFT STORE DEAD-ZONE MODE
    </div>
    <div class="icon">📶</div>
    <h1>No Cellular Signal</h1>
    <p>You're in a offline dead zone. Don't worry — your camera scanner & cached items are stored locally on your device!</p>

    <div class="actions">
      <a href="/lens" class="btn">
        📷 Launch Camera Scanner Offline
      </a>
      <button onclick="window.location.reload()" class="btn btn-secondary">
        🔄 Check Signal Connection
      </button>
    </div>
  </div>

  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
