<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #ffffff;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 13px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 0;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Spadas Swoopa</div>
  </div>
  <div class="badge">🟢 Live Session Sync Active</div>
  <div class="desc">
    Automatically extracts real Facebook Marketplace listings from your browser and syncs them to Spadas Radar!
  </div>
  <a href="https://spadas-tech.vercel.app/radar" target="_blank" class="btn">Open Spadas Radar Dashboard</a>
</body>
</html>
